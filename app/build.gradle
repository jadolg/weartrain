plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    compileSdk 36
    namespace 'dev.akiel.weartrain'

    defaultConfig {
        applicationId "dev.akiel.weartrain"
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // ponytail: debug key so it upgrades in place over the sideloaded debug build; use a real keystore before Play
            signingConfig signingConfigs.debug
        }
    }
    buildFeatures {
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def wear = '1.6.2'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation "androidx.wear.compose:compose-material3:$wear"
    implementation "androidx.wear.compose:compose-foundation:$wear"
    implementation "androidx.wear.compose:compose-navigation:$wear"
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.3.0'
    implementation 'androidx.wear.tiles:tiles:1.6.2'
    implementation 'androidx.wear.protolayout:protolayout-material3:1.4.2'
    implementation 'androidx.concurrent:concurrent-futures-ktx:1.3.0'
    testImplementation 'junit:junit:4.13.2'
}
